  <text x="466" y="374" font-family="JetBrains Mono, monospace" font-size="11"
        letter-spacing="0.2" fill="#5C564B">illisible, et le restera :</text>
  <text x="466" y="391" font-family="JetBrains Mono, monospace" font-size="11"
        letter-spacing="0.2" fill="#A4502F">la clé n’est jamais arrivée ici</text>

  <line x1="754" y1="310" x2="814" y2="310" stroke="#A4502F" stroke-width="1.8"
        marker-end="url(#fleche-tc)"/>

  <!-- 3. Chez le destinataire : le meme dossier, une seule fois. -->
  <rect x="820" y="210" width="300" height="200" rx="4" fill="#F5F1E8" stroke="#D9D2C0"/>
  <text x="836" y="238" font-family="JetBrains Mono, monospace" font-size="12.5"
        letter-spacing="0.6" fill="#1A1814">CHEZ LE DESTINATAIRE</text>
  <line x1="836" y1="250" x2="1104" y2="250" stroke="#D9D2C0"/>
  <g font-family="JetBrains Mono, monospace" font-size="12.5" fill="#1A1814">
