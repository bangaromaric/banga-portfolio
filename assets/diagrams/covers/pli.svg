    <text x="836" y="303">bulletin-09.pdf</text>
    <text x="836" y="324">releve-banque.pdf</text>
  </g>
  <text x="836" y="374" font-family="JetBrains Mono, monospace" font-size="11"
        letter-spacing="0.2" fill="#5C564B">rendu une seule fois, puis</text>
  <text x="836" y="391" font-family="JetBrains Mono, monospace" font-size="11"
        letter-spacing="0.2" fill="#5C564B">le serveur n’a plus rien</text>

  <!-- Etiquettes sous les trois etats. -->
  <g font-family="JetBrains Mono, monospace" font-size="11.5" letter-spacing="1.4"
     fill="#5C564B" text-anchor="middle">
    <text x="230" y="436">AES-256-GCM</text>
    <text x="600" y="436">AUCUNE CLÉ ICI</text>
    <text x="970" y="436">UNE SEULE FOIS</text>
  </g>

  <!-- Accroche secondaire. -->
  <text x="80" y="490" font-family="Newsreader, Georgia, serif" font-size="22"
        fill="#5C564B">La clé voyage dans la partie de l’adresse que les navigateurs ne transmettent jamais.</text>

  <!-- Filet bas. -->
  <line x1="80" y1="538" x2="1120" y2="538" stroke="#D9D2C0" stroke-width="1"/>

  <!-- Pied. -->
  <text x="80" y="560" font-family="JetBrains Mono, monospace" font-size="20"
        letter-spacing="2" fill="#5C564B">GO · REDIS · CLOUD RUN · USAGE UNIQUE</text>

  <!-- Signature LinkedIn, en haut a droite, sur la ligne du kicker.
       Obligatoire sur toute cover. Le bloc est cale a droite sur x=1120,
       bord de la zone de securite : il survit au recadrage 16/9.
       Arial et non une webfont pour le sigle : la police est installee sur la
       machine, le sigle ne depend donc pas du chargement de Google Fonts. -->
  <g transform="translate(964,72)">
    <rect x="0" y="0" width="30" height="30" rx="5" fill="#0A66C2"/>
    <text x="15" y="21.5" font-family="Arial, Helvetica, sans-serif" font-size="16"
          font-weight="700" fill="#FFFFFF" text-anchor="middle">in</text>
  </g>
  <text x="1120" y="88" text-anchor="end" font-family="JetBrains Mono, monospace"
        font-size="14" letter-spacing="0.5" fill="#1A1814">Romaric BANGA</text>
  <text x="1120" y="103" text-anchor="end" font-family="JetBrains Mono, monospace"
        font-size="11" letter-spacing="0.2" fill="#5C564B">in/romaric-banga</text>
