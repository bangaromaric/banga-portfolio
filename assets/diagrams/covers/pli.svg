<!--
  Cover de la fiche projet « Pli ».
  Derive de .claude/skills/diagramme-archi/assets/gabarit-cover.svg.

  Rasteriser :
      bash .claude/skills/diagramme-archi/scripts/make_cover.sh pli

  Le damier central compte 68 rectangles d'opacites fixes. Il a ete
  genere une fois puis fige ici : ce fichier est autonome, et se
  retouche a la main comme les autres covers.

  Couleurs EN DUR : Chrome rend ce fichier hors du CSS du site.
  Palette du site : papier #F5F1E8 / #ECE6D5, encre #1A1814 / #5C564B,
  filet #D9D2C0, terracotta #A4502F.

  SUJET : les trois etats d'un pli, et ce que chaque partie peut lire.
  Le bloc central est un damier de densite et NON un echantillon de
  base64 : il doit dire « illisible » sans rien apprendre a qui
  voudrait refaire le produit. Aucun nom de champ, aucune grammaire de
  lien, aucun parametre de derivation ne figure sur cette image.

  ZONE DE SECURITE : rien de signifiant hors de 80,48 -> 1120,582.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="pagne" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <g fill="none">
        <path d="M0 11 L11 0 L22 11 L11 22 Z" stroke="#1A1814" stroke-width="0.4" stroke-opacity="0.10"/>
        <circle cx="11" cy="11" r="1.2" fill="#1A1814" fill-opacity="0.06"/>
      </g>
    </pattern>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#ECE6D5"/>
    </linearGradient>
    <marker id="fleche-tc" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#A4502F"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#fond)"/>
  <rect width="1200" height="630" fill="url(#pagne)"/>

  <!-- Kicker. Reste sous 870 px : il partage sa ligne avec la signature. -->
  <text x="80" y="90" font-family="JetBrains Mono, monospace" font-size="20"
        letter-spacing="3" fill="#5C564B">§ PLI · CHIFFREMENT DANS LE NAVIGATEUR</text>

  <!-- Titre, une ligne. L'accent italique terracotta vaut la syntaxe [mot] du site. -->
  <text x="80" y="160" font-family="Fraunces, Georgia, serif" font-size="44"
        font-weight="350" letter-spacing="-0.9" fill="#1A1814">Un pli s’ouvre une fois, puis <tspan
        font-style="italic" fill="#A4502F">disparaît</tspan>.</text>

  <!-- ============ Les trois etats, de gauche a droite ============ -->

  <!-- 1. Chez l'expediteur : le dossier en clair. -->
  <rect x="80" y="210" width="300" height="200" rx="4" fill="#F5F1E8" stroke="#D9D2C0"/>
  <text x="96" y="238" font-family="JetBrains Mono, monospace" font-size="12.5"
        letter-spacing="0.6" fill="#1A1814">CHEZ L’EXPÉDITEUR</text>
  <line x1="96" y1="250" x2="364" y2="250" stroke="#D9D2C0"/>
  <g font-family="JetBrains Mono, monospace" font-size="12.5" fill="#1A1814">
    <text x="96" y="282">CNI-recto.jpg</text>
    <text x="96" y="303">bulletin-09.pdf</text>
    <text x="96" y="324">releve-banque.pdf</text>
  </g>
  <text x="96" y="374" font-family="JetBrains Mono, monospace" font-size="11"
        letter-spacing="0.2" fill="#5C564B">chiffré ici, dans le navigateur,</text>
  <text x="96" y="391" font-family="JetBrains Mono, monospace" font-size="11"
        letter-spacing="0.2" fill="#5C564B">avant qu’un octet ne parte</text>

  <line x1="384" y1="310" x2="444" y2="310" stroke="#A4502F" stroke-width="1.8"
        marker-end="url(#fleche-tc)"/>

  <!-- 2. Sur le serveur : le damier. Pas un echantillon de format. -->
