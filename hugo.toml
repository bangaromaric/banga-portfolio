[[params.socialIcons]]
name = "linkedin"
url = "https://www.linkedin.com/in/romaric-banga/"

[[params.socialIcons]]
name = "github"
url = "https://github.com/bangaromaric"

[[params.socialIcons]]
name = "twitter"
url = "https://x.com/bangaromaric"

[[params.socialIcons]]
name = "facebook"
url = "https://www.facebook.com/profile.php?id=61585782202218"

[[params.socialIcons]]
name = "rss"
