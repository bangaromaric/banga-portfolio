# ----------------------------------------------------------------------------
# Services
# ----------------------------------------------------------------------------
[services]
  [services.googleAnalytics]
  id = 'G-WHSESG5NQH'


# ----------------------------------------------------------------------------
# Sitemap. Les priorités fines sont dans layouts/sitemap.xml (override) :
# home 1.0, sections 0.8, projets 0.7, posts 0.6, tags et categories exclus.
# ----------------------------------------------------------------------------
[sitemap]
changefreq = "weekly"
priority = 0.5
filename = "sitemap.xml"


# ----------------------------------------------------------------------------
# Related content : alimente la section « Articles connexes » des posts.
# Un article qui ne partage aucun tag avec le corpus n'aura aucun connexe.
# ----------------------------------------------------------------------------
[related]
includeNewer = true
threshold = 60
toLower = false

[[related.indices]]
  name = "tags"
  weight = 80

[[related.indices]]
  name = "categories"
  weight = 60

[[related.indices]]
  name = "date"
  weight = 10


# ----------------------------------------------------------------------------
# Menu principal
# ----------------------------------------------------------------------------
[[menu.main]]
name = "Accueil"
url = "/"
weight = 1

[[menu.main]]
name = "À propos"
url = "/about/"
weight = 2

[[menu.main]]
name = "Projets"
url = "/projects/"
weight = 3

[[menu.main]]
name = "Blog"
url = "/posts/"
weight = 4

[[menu.main]]
name = "Newsletter"
url = "/newsletter/"
weight = 5

[[menu.main]]
name = "GDG Libreville"
url = "/gdg/"
weight = 6


# ----------------------------------------------------------------------------
# Minification HTML : garder les guillemets sur les attributs.
# Sans cela, Hugo retire les guillemets HTML5-légaux (`name=description`), ce qui
# casse certains parsers SEO stricts. Cf. CLAUDE.md §10.1, symptôme historique
# sur msvalidate.01.
# ----------------------------------------------------------------------------
[minify.tdewolff.html]
keepQuotes = true


# ----------------------------------------------------------------------------
# Markup
# ----------------------------------------------------------------------------
[markup]

  # unsafe = true autorise le HTML brut dans le markdown. Nécessaire pour les
  # badges de content/about.md et pour le SVG inline des diagrammes.
  [markup.goldmark.renderer]
  unsafe = true

  # Coloration syntaxique par CLASSES et non par styles inline.
  # Par défaut Hugo utilise noclasses = true et le style monokai, ce qui écrit
  # un style inline sur chaque <pre> et rend --code-block-bg inopérant.
  # Les classes sont habillées par assets/css/extended/15-chroma.css, en tokens,
  # donc le code suit le mode sombre comme le reste du site.
  [markup.highlight]
  noClasses = false
  lineNos = false
  tabWidth = 4
  wrapperClass = "highlight"

  # Attributs de bloc NON activés volontairement : les attributs {caption="..."}
  # des fences viennent de la chaîne d'information, que Hugo parse lui-même, et
  # activer parser.attribute.block changerait le parsing des articles existants.
  [markup.goldmark.parser.attribute]
  title = true
  block = false
