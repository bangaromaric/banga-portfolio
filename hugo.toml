# ============================================================================
# Configuration Hugo de ban.ga
#
# RÈGLE D'ORDRE TOML, à lire avant toute modification de ce fichier.
#
# En TOML, un header de table capture TOUTES les clés qui le suivent, jusqu'au
# header suivant. Une clé simple écrite après [params.schema] atterrit donc dans
# params.schema, pas dans params, et Hugo ne signale rien : le paramètre est
# simplement ignoré, en silence.
#
# Ce fichier a eu ce bug : huit drapeaux PaperMod (ShowShareButtons,
# ShowCodeCopyButtons, ShowBreadCrumbs, UseHugoToc...) et mainSections étaient
# écrits après [params.schema] et [[related.indices]]. Ils ne s'appliquaient pas.
#
# Donc : toutes les clés simples de [params] en premier, les sous-tables
# [params.xxx] ensuite, les tableaux de tables [[params.xxx]] en dernier.
# `python scripts/hugo_doctor.py` vérifie cette règle.
# ============================================================================

baseURL = 'https://ban.ga'
languageCode = 'fr'
defaultContentLanguage = 'fr'
title = 'BANGA Romaric | Développeur Spring & Google Cloud | GDG Libreville | Gabon'
theme = 'PaperMod'
enableGitInfo = true

# Pas de pages de taxonomie. Elles representaient 33 des 50 pages generees et
# 33 flux RSS, pour un contenu maigre : un titre et deux liens. La navigation
# par sujet du site passe par la section « Articles connexes », calculee par
# [related] a partir du frontmatter, qui n'a pas besoin de ces pages.
# Corollaire indispensable : aucun template ne doit plus lier vers /tags/ ni
# /categories/, sinon les liens pointent vers des 404.
disableKinds = ["taxonomy", "term"]


# ----------------------------------------------------------------------------
# [params] : clés simples UNIQUEMENT. Toute clé ajoutée plus bas dans le fichier
# n'atterrira pas ici.
# ----------------------------------------------------------------------------
[params]
author = "BANGA Romaric"
description = "Portfolio de BANGA Romaric Tanguy, VMware Spring Certified Professional 2024 v2, Google Cloud Associate Engineer, lead Spring developer à l'ANINF, organisateur du Google Developers Group Libreville."
keywords = ["BANGA Romaric", "Romaric Banga", "Spring Certified Professional", "VMware Spring Certified", "Broadcom Spring", "Spring Pro Gabon", "Spring developer Gabon", "développeur Spring Gabon", "Spring Boot Libreville", "Spring AI", "Spring AI Gabon", "Google Cloud Gabon", "GCP Cloud Engineer Gabon", "architecte cloud Gabon", "GDG Libreville", "DevFest Libreville", "Libreville", "ANINF", "Microservices", "Java Spring Boot", "Android Kotlin", "DevFest Gabon", "consulting Spring Afrique", "consulting IA générative Afrique", "formation Spring AI", "formation Spring Boot Gabon", "VMware Spring expert Afrique"]
env = "production"

# SEO et métadonnées
images = ["/images/og-default.jpg"]

# Thème clair/sombre
defaultTheme = "auto"
disableThemeToggle = false

# Sections affichées sur la home et dans les listings.
# Note : layouts/index.html filtre explicitement par Section, donc cette clé
# sert surtout aux templates PaperMod non surchargés.
mainSections = ["posts", "projects"]

# Drapeaux PaperMod. Ils doivent rester ICI, au-dessus de toute sous-table.
#
# ÉTAT RÉEL : aucun n'a d'effet aujourd'hui, parce que chaque template PaperMod
# qui les lit est surchargé dans layouts/. Ils sont conservés pour le jour où un
# de ces templates cesserait de l'être, et parce qu'une valeur fausse serait plus
# trompeuse qu'une valeur inerte. Qui lit quoi :
#   ShowReadingTime, ShowWordCount  -> partials/post_meta.html      (surchargé)
#   ShowBreadCrumbs                 -> partials/breadcrumbs.html    (non appelé)
#   ShowPostNavLinks                -> _default/single.html         (surchargé)
#   ShowRssButtonInSectionTermList  -> _default/list.html           (surchargé)
#   UseHugoToc                      -> partials/toc.html            (non appelé)
#   ShowCodeCopyButtons             -> partials/footer.html         (surchargé)
#   ShowShareButtons                -> plus aucun consommateur depuis que le
#                                      doublon a été retiré de posts/single.html
# Le site rend ces fonctions lui-même : métadonnées dans posts/single.html,
# navigation inter-articles idem, partage via partials/share-buttons.html.
ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = false
hidemeta = false
hideSummary = false
showtoc = false
tocopen = false


# ----------------------------------------------------------------------------
# Sous-tables de [params]
# ----------------------------------------------------------------------------

# Search Console & Webmaster verification
# Google Search Console : déjà vérifié via DNS (propriété de type "Domaine"), pas
# de meta tag nécessaire.
# Bing Webmaster Tools : importé depuis Google Search Console. Le token reste ici
# par redondance (cf. CLAUDE.md §10.1 : la vérification par meta tag échouait
# avant keepQuotes).
[params.analytics]
  [params.analytics.bing]
  SiteVerificationTag = "308BF07CFE01FB477AA7479FC7ABA3A4"

# Newsletter : Buttondown (provider externe, POST depuis le form embed).
[params.newsletter]
provider = "buttondown"
username = "romaricbanga"
name = "Mbolo Letter"
tagline = "Un email à chaque nouvel article. [Pas plus.]"

# Schema.org : portfolio personnel, donc publisherType = Person.
[params.schema]
publisherType = "Person"
sameAs = [
  "https://www.linkedin.com/in/romaric-banga/",
  "https://github.com/bangaromaric",
  "https://x.com/bangaromaric",
  "https://www.facebook.com/profile.php?id=61585782202218",
  "https://gdg.community.dev/gdg-libreville/",
  "https://g.dev/romaricbanga"
]

# Mode profile désactivé : la home est gérée par layouts/index.html.
[params.profileMode]
enabled = false


# ----------------------------------------------------------------------------
# Tableaux de tables de [params] : toujours en dernier dans la section params.
# ----------------------------------------------------------------------------

[[params.socialIcons]]
